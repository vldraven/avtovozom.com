# Продакшен: только localhost-порты для web/backend (за Caddy/nginx), БД и Redis без публикации наружу.
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
# Переменные: см. .env.example (POSTGRES_*, CORS_ORIGINS, NEXT_PUBLIC_API_URL, SMTP_*, …)

services:
  postgres:
    image: postgres:16-alpine
    container_name: avtovozom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avtovozom}
      POSTGRES_USER: ${POSTGRES_USER:-avtovozom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: avtovozom_redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: avtovozom_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-avtovozom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-avtovozom}
      PARSER_INTERVAL_HOURS: "24"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-}
      # IndexNow: мгновенный пинг Яндекс/Bing при создании/снятии объявления (пусто — выключено)
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      N8N_TELEGRAM_BOT_API_SECRET: ${N8N_TELEGRAM_BOT_API_SECRET:-}
      AGENT_API_SECRET: ${AGENT_API_SECRET:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_GROUP_ACCESS_TOKEN: ${VK_GROUP_ACCESS_TOKEN:-}
      VK_USER_ACCESS_TOKEN: ${VK_USER_ACCESS_TOKEN:-}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_CHANNEL_CHAT_ID: ${MAX_CHANNEL_CHAT_ID:-}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
      MAX_MAX_PHOTOS: ${MAX_MAX_PHOTOS:-10}
      CHE168_MAX_LINKS_PER_MODEL: "40"
      CHE168_NEW_PER_RUN: "0"
      CHE168_PROXY: ${CHE168_PROXY:-}
      CHE168_PARSE_DETAIL_TIMEOUT_SEC: ${CHE168_PARSE_DETAIL_TIMEOUT_SEC:-300}
      CHE168_PW_GOTO_TIMEOUT_MS: ${CHE168_PW_GOTO_TIMEOUT_MS:-120000}
      MEDIA_ROOT: /app/media
      # Запас под SSR + картинки + polling; иначе QueuePool timeout валит /cars и главную.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./media:/app/media
    # Если процесс «жив» но глух (RST / 100% CPU) — autoheal перезапустит контейнер.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 90s

  parser:
    build:
      context: ./backend
    container_name: avtovozom_parser
    restart: unless-stopped
    command: python -m app.parser_worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-avtovozom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-avtovozom}
      PARSER_POLL_SECONDS: "10"
      # IndexNow: воркер пингует Яндекс/Bing при добавлении/восстановлении объявления парсером
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      CHE168_MAX_LINKS_PER_MODEL: "40"
      CHE168_NEW_PER_RUN: "0"
      CHE168_PROXY: ${CHE168_PROXY:-}
      CHE168_PARSE_DETAIL_TIMEOUT_SEC: ${CHE168_PARSE_DETAIL_TIMEOUT_SEC:-300}
      CHE168_PW_GOTO_TIMEOUT_MS: ${CHE168_PW_GOTO_TIMEOUT_MS:-120000}
      MEDIA_ROOT: /app/media
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./media:/app/media

  web:
    build:
      context: ./web
      args:
        # Важно: Next.js вшивает NEXT_PUBLIC_* при сборке образа, не при старте контейнера.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
        NEXT_PUBLIC_YANDEX_VERIFICATION: ${NEXT_PUBLIC_YANDEX_VERIFICATION:-}
        NEXT_PUBLIC_GOOGLE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_VERIFICATION:-}
    container_name: avtovozom_web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
      NEXT_PUBLIC_YANDEX_VERIFICATION: ${NEXT_PUBLIC_YANDEX_VERIFICATION:-}
      NEXT_PUBLIC_GOOGLE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_VERIFICATION:-}
      # SSR должен ходить в backend по Docker-сети, не через публичный Caddy (иначе 300s 504).
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8000}
      # IndexNow: тот же ключ, что у backend — web раздаёт /indexnow-key.txt (читается в рантайме SSR)
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Перезапуск unhealthy-контейнеров (compose сам по healthcheck не рестартит).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: avtovozom_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: "20"
      AUTOHEAL_START_PERIOD: "90"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
