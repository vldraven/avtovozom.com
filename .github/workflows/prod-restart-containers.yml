# Быстрый перезапуск Docker-контейнеров на проде без rsync и пересборки.
# Actions → Prod restart containers → Run workflow
name: Prod restart containers

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart docker compose services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST:-}" && test -n "${DEPLOY_USER:-}" && test -n "${DEPLOY_PATH:-}" && test -n "${SSH_KEY:-}" || {
            echo "Missing secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY"
            exit 1
          }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}")
          "${SSH[@]}" "cd '${DEPLOY_PATH}' && (
            echo '=== before ==='
            docker compose -f docker-compose.prod.yml ps
            echo '=== restart ==='
            docker compose -f docker-compose.prod.yml restart
            sleep 5
            echo '=== after ==='
            docker compose -f docker-compose.prod.yml ps
            echo '=== health ==='
            curl -fsS http://127.0.0.1:8000/health || true
            curl -fsS -o /dev/null -w 'web:%{http_code}\n' http://127.0.0.1:3000/ || true
            echo '=== caddy ==='
            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl reload caddy || sudo systemctl restart caddy || true
            fi
          )"
